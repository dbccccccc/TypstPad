server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json application/wasm;

    # Enable Brotli compression (better than gzip, ~15-25% smaller)
    brotli on;
    brotli_comp_level 6;
    brotli_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json application/wasm font/woff2;

    # Serve the .br/.gz files written by scripts/precompress.mjs during the image
    # build, so large assets are not compressed again for every request.
    brotli_static on;
    gzip_static on;

    # Cross-origin isolation and security headers. Each location below that adds
    # its own header must include this file again, or nginx drops these headers.
    include /etc/nginx/snippets/typstpad-security-headers.conf;

    # Vite fingerprints these file names, so their content never changes
    location ^~ /assets/ {
        include /etc/nginx/snippets/typstpad-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Avoid long-term caching for update-critical scripts
    location = /sw.js {
        include /etc/nginx/snippets/typstpad-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location = /theme-init.js {
        include /etc/nginx/snippets/typstpad-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Preserve links to the guides consolidated into /guide.
    location ~ ^/guides/(typst-to-png-svg|image-to-typst)(/|/index\.html)?$ {
        absolute_redirect off;
        return 301 /guide$is_args$args;
    }

    # Serve pre-rendered pages and return real 404 responses for unknown URLs.
    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    # Pages and the files copied from public/ keep the same URL across releases,
    # so browsers revalidate them and pick up a new deployment immediately.
    location / {
        include /etc/nginx/snippets/typstpad-security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html =404;
    }

    # Health check endpoint
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }
}
