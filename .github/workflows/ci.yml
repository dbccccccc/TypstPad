name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Build production assets
        run: npm run build

      - name: Check self-hosted SEO output
        run: npm run test:seo

      - name: Build official website
        run: npm run build:site

      - name: Check official website SEO output
        run: npm run test:seo -- --site-url https://typstpad.com

      - name: Check Nginx routing and headers
        run: |
          docker build --build-arg BUILD_MODE=site -t typstpad-seo-check .
          docker run -d --name typstpad-seo-check -p 127.0.0.1:8080:80 typstpad-seo-check
          trap 'docker rm -f typstpad-seo-check' EXIT
          docker exec typstpad-seo-check nginx -t
          npm run test:seo -- --site-url https://typstpad.com --base-url http://127.0.0.1:8080
