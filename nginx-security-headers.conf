# Response headers for every TypstPad response. Nginx only inherits add_header
# directives into blocks that define none of their own, so nginx.conf includes
# this file in the server block and again in each location that adds a header.

# Required for SharedArrayBuffer support (Typst.ts requirement)
add_header Cross-Origin-Opener-Policy same-origin always;
add_header Cross-Origin-Embedder-Policy require-corp always;

# Security headers. script-src allows the Cloudflare Web Analytics beacon that
# Cloudflare injects on typstpad.com; it reports to /cdn-cgi/rum on this origin.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://packages.typst.org; worker-src 'self' blob:; child-src 'self' blob:;" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
